<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#d9ebc9" />
  <meta name="description" content="고양이·토끼·여우·곰이 함께하는 마법정원 게임의 첫 프로토타입" />
  <title>곰같은여우의 마법정원 · 첫 정원</title>
</head>
<body>
  <div id="app">
    <div id="stage" aria-label="마법정원 게임 화면"></div>
    <header class="hud top-hud">
      <div class="brand"><span class="brand-mark">🌷</span><div><strong>곰같은여우의 마법정원</strong><small id="zone-name">중앙 마을</small></div></div>
      <div class="hud-stats"><span>🌱 <b id="seed-count">5</b></span><span>🍓 <b id="berry-count">0</b></span></div>
    </header>
    <section class="guide" id="guide" aria-live="polite">길을 눌러 여우와 함께 걸어볼까?</section>
    <section class="area-panel" aria-label="지역 이동">
      <button type="button" id="town-button" class="area active">🏡 마을</button>
      <button type="button" id="farm-button" class="area">🌿 큰 텃밭</button>
      <button type="button" id="lab-button" class="area">🧪 실험실</button>
      <button type="button" id="nursery-button" class="area">🥚 연구소</button>
    </section>
    <nav class="hud bottom-hud" aria-label="게임 메뉴">
      <button type="button" id="bag-button"><span>🎒</span><small>가방</small></button>
      <button type="button" id="map-button"><span>🗺️</span><small>지역</small></button>
      <button type="button" id="book-button"><span>📖</span><small>도감</small></button>
      <button type="button" id="help-button"><span>💡</span><small>도움말</small></button>
    </nav>
    <div id="modal-root" class="modal-root hidden" role="presentation">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-head"><strong id="modal-title"></strong><button id="modal-close" type="button" aria-label="닫기">✕</button></div>
        <p id="modal-status" class="modal-status" role="status" aria-live="polite"></p>
        <div id="modal-content"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
