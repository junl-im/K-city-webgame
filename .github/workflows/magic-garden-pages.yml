name: Magic Garden — actual GitHub Pages deployment

# Publishing build files to a branch with GITHUB_TOKEN is not a Pages deployment.
on:
  push:
    branches:
      - main
    paths:
      - 'MagicGarden/**'
      - 'SixtySecondPlayground/**'
      - 'PhysicsPopbook/**'
      - 'FlowerMatgo/**'
      - 'LieRoom/**'
      - 'ForestGuard/**'
      - 'CannonTale/**'
      - '.github/workflows/magic-garden-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: magic-garden-real-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'junl-im/K-city-webgame' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout Magic Garden only
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install game dependencies
        working-directory: MagicGarden
        run: npm install --no-audit --no-fund
      - name: Build and run all game checks
        working-directory: MagicGarden
        run: npm run build
      - name: Verify site assets and record version
        shell: bash
        run: |
          set -euo pipefail
          test -s MagicGarden/dist/index.html
          test -s MagicGarden/dist/assets/town-scene-v1.webp
          test -s MagicGarden/dist/assets/creek-shimmer-v1.webp
          test -s MagicGarden/dist/assets/creek-cascade-v1.webp
          test -s MagicGarden/dist/assets/fox-four-directions-v1.webp
          printf '%s\n' "${GITHUB_SHA}" > MagicGarden/dist/deployed-source-sha.txt
          touch MagicGarden/dist/.nojekyll
      - name: Verify 60-second playground and stage a separate subpage
        shell: bash
        run: |
          set -euo pipefail
          node SixtySecondPlayground/tests/smoke.cjs
          test -s SixtySecondPlayground/dist/index.html
          test -s SixtySecondPlayground/dist/style.css
          test -s SixtySecondPlayground/dist/app.js
          mkdir -p MagicGarden/dist/SixtySecondPlayground
          cp -a SixtySecondPlayground/dist/. MagicGarden/dist/SixtySecondPlayground/
          test -s MagicGarden/dist/SixtySecondPlayground/assets/park-v3.webp
          echo "Independent arcade staged at /SixtySecondPlayground/"
      - name: Verify living physics popbook and stage a separate subpage
        shell: bash
        run: |
          set -euo pipefail
          (cd PhysicsPopbook && node --test *.test.mjs dist/*.test.mjs)
          test -s PhysicsPopbook/dist/index.html
          test -s PhysicsPopbook/dist/app.js
          test -s PhysicsPopbook/dist/assets/physics-surface-atlas-v17.webp
          test -s PhysicsPopbook/dist/assets/science-nav-icons-v20.webp
          mkdir -p MagicGarden/dist/PhysicsPopbook
          cp -a PhysicsPopbook/dist/. MagicGarden/dist/PhysicsPopbook/
          test -s MagicGarden/dist/PhysicsPopbook/assets/fox-professor-v03.webp
          echo "Independent physics popbook staged at /PhysicsPopbook/"
      - name: Test, build, and stage Flower Matgo at its own Pages path
        shell: bash
        run: |
          set -euo pipefail
          (cd FlowerMatgo && npm ci --no-audit --no-fund)
          (cd FlowerMatgo && npm test)
          (cd FlowerMatgo && npm run build -- --base=/K-city-webgame/FlowerMatgo/)
          test -s FlowerMatgo/dist/index.html
          test -s FlowerMatgo/dist/assets/hwatu-character-original-v19.webp
          test -s FlowerMatgo/dist/assets/flower-game-floor-mat-v18.webp
          grep -q '/K-city-webgame/FlowerMatgo/assets/' FlowerMatgo/dist/index.html
          mkdir -p MagicGarden/dist/FlowerMatgo
          cp -a FlowerMatgo/dist/. MagicGarden/dist/FlowerMatgo/
          test -s MagicGarden/dist/FlowerMatgo/assets/hwatu-character-original-v19.webp
          echo "Independent Flower Matgo staged at /FlowerMatgo/"
      - name: Test and stage Lie Room as an independent page
        shell: bash
        run: |
          set -euo pipefail
          node LieRoom/tests/smoke.mjs
          node --check LieRoom/dist/app.mjs
          test -s LieRoom/dist/index.html
          test -s LieRoom/dist/assets/fox-detective.png
          mkdir -p MagicGarden/dist/LieRoom
          cp -a LieRoom/dist/. MagicGarden/dist/LieRoom/
          test -s MagicGarden/dist/LieRoom/index.html
          echo "Independent Lie Room staged at /LieRoom/"

      - name: Verify and stage Forest Guard as an isolated page
        shell: bash
        run: |
          set -euo pipefail
          node ForestGuard/tests/smoke.mjs
          test -s ForestGuard/index.html
          test -s ForestGuard/style.css
          test -s ForestGuard/screen-rebuild-v26.css
          test -s ForestGuard/combat-feedback-v27.css
          test -s ForestGuard/illustrated-v31.css
          test -s ForestGuard/button-system-v33.css
          test -s ForestGuard/element-spells-v38.css
          test -s ForestGuard/scene-v35.css
           test -s ForestGuard/chapter-ascent-v36.css
           test -s ForestGuard/modal-simplify-v45.css
          test -s ForestGuard/scene-v35.js
          test -s ForestGuard/art/rani-element-spells-v38.png
          test -s ForestGuard/art/rani-fox-rear-attack-v41.png
          for asset in bear rabbit cat megafox; do test -s "ForestGuard/art/rani-$asset-attack-v44.webp"; done
          test -s ForestGuard/art/rani-rearguard-v35.png
          test -s ForestGuard/illustration-continuity-v34.css
          test -s ForestGuard/game.js
          test -s ForestGuard/visuals.js
          test -s ForestGuard/art/forest-characters.png
          test -s ForestGuard/art/rani-evolution.png
          test -s ForestGuard/art/forest-battleground-v04.webp
          test -s ForestGuard/art/rani-ui-icons-v04.webp
          test -s ForestGuard/art/forest-worldmap-v05.webp
          test -s ForestGuard/art/forest-entrance-v08.png
          test -s ForestGuard/art/misty-canyon-v08.png
          test -s ForestGuard/art/moonlit-highland-v08.png
          test -s ForestGuard/art/forest-monsters-v12.png
          test -s ForestGuard/art/hero-station-v12.png
          test -s ForestGuard/art/forest-monsters-v14-clean.webp
          test -s ForestGuard/art/forest-monsters-hurt-clean-v49.webp
          test -s ForestGuard/choice-polish-v49.css
          test -s ForestGuard/legibility-v491.css
          test -s ForestGuard/forest-choice-v50.css
          test -s ForestGuard/chapter-boss-v51.css
          test -s ForestGuard/art/chapter2-masked-mole-v51.webp
          test -s ForestGuard/art/chapter3-black-bell-v51.webp
          test -s ForestGuard/art/chapter1-root-giant-v52.webp
          test -s ForestGuard/art/chapter1-forest-sentinel-v52.webp
          test -s ForestGuard/art/chapter1-thorn-beetle-v53.webp
          test -s ForestGuard/art/chapter1-mushroom-runner-v55.webp
          test -s ForestGuard/art/chapter1-sentinel-vfx-v56.webp
          test -s ForestGuard/stage-lettering-v55.css
          for asset in forest-choice-card recruit-bear-cutout recruit-rabbit-cutout recruit-cat-cutout; do test -s "ForestGuard/art/$asset-v50.webp"; done
          test -s ForestGuard/art/hero-station-v14.webp
          test -s ForestGuard/art/fort-hud-v14.webp
          test -s ForestGuard/art/title-hero-v18.webp
          test -s ForestGuard/art/recruit-bear-v18.webp
          test -s ForestGuard/art/recruit-rabbit-v18.webp
           test -s ForestGuard/art/recruit-rabbit-clean-v46.webp
          test -s ForestGuard/art/recruit-cat-v18.webp
          test -s ForestGuard/art/mushroom-colossus-attack-v19.webp
          test -s ForestGuard/art/painted-rampart-front-v24.webp
          for asset in rani-title-v31.webp rani-rear-party-v31.webp rani-board-acorn-v31.webp rani-board-map-v31.webp rani-button-atlas-v31.webp rani-board-fox-v31.webp; do test -s "ForestGuard/art/$asset"; done
          for asset in gold emerald stone sapphire parchment crimson; do test -s "ForestGuard/art/btn-$asset-v33.webp"; done
          mkdir -p MagicGarden/dist/ForestGuard/art
          cp ForestGuard/index.html ForestGuard/element-spells-v38.css ForestGuard/style.css ForestGuard/screen-rebuild-v26.css ForestGuard/combat-feedback-v27.css ForestGuard/illustrated-v31.css ForestGuard/button-system-v33.css ForestGuard/illustration-continuity-v34.css ForestGuard/scene-v35.css ForestGuard/chapter-ascent-v36.css ForestGuard/modal-simplify-v45.css ForestGuard/modal-composition-v47.css ForestGuard/result-continuity-v48.css ForestGuard/choice-polish-v49.css ForestGuard/legibility-v491.css ForestGuard/forest-choice-v50.css ForestGuard/scene-v35.js ForestGuard/visuals.js ForestGuard/game.js MagicGarden/dist/ForestGuard/
          cp ForestGuard/chapter-boss-v51.css MagicGarden/dist/ForestGuard/
          cp ForestGuard/home-lettering-v54.css MagicGarden/dist/ForestGuard/
          cp ForestGuard/stage-lettering-v55.css MagicGarden/dist/ForestGuard/
          test -s MagicGarden/dist/ForestGuard/home-lettering-v54.css
          test -s MagicGarden/dist/ForestGuard/stage-lettering-v55.css
          test -s MagicGarden/dist/ForestGuard/screen-rebuild-v26.css
          test -s MagicGarden/dist/ForestGuard/combat-feedback-v27.css
          test -s MagicGarden/dist/ForestGuard/illustrated-v31.css
          test -s MagicGarden/dist/ForestGuard/button-system-v33.css
          test -s MagicGarden/dist/ForestGuard/illustration-continuity-v34.css
          test -s MagicGarden/dist/ForestGuard/scene-v35.css
          test -s MagicGarden/dist/ForestGuard/modal-composition-v47.css
          test -s MagicGarden/dist/ForestGuard/result-continuity-v48.css
          test -s MagicGarden/dist/ForestGuard/choice-polish-v49.css
          test -s MagicGarden/dist/ForestGuard/legibility-v491.css
          test -s MagicGarden/dist/ForestGuard/forest-choice-v50.css
           test -s MagicGarden/dist/ForestGuard/chapter-ascent-v36.css
           test -s MagicGarden/dist/ForestGuard/modal-simplify-v45.css
          test -s MagicGarden/dist/ForestGuard/scene-v35.js
          cp ForestGuard/art/forest-characters.png ForestGuard/art/rani-evolution.png ForestGuard/art/forest-battleground-v04.webp ForestGuard/art/rani-ui-icons-v04.webp ForestGuard/art/forest-worldmap-v05.webp ForestGuard/art/forest-entrance-v08.png ForestGuard/art/misty-canyon-v08.png ForestGuard/art/moonlit-highland-v08.png ForestGuard/art/forest-monsters-v12.png ForestGuard/art/hero-station-v12.png ForestGuard/art/forest-monsters-v14-clean.webp ForestGuard/art/hero-station-v14.webp ForestGuard/art/fort-hud-v14.webp ForestGuard/art/title-hero-v18.webp ForestGuard/art/recruit-bear-v18.webp ForestGuard/art/recruit-rabbit-v18.webp ForestGuard/art/recruit-rabbit-clean-v46.webp ForestGuard/art/recruit-cat-v18.webp ForestGuard/art/mushroom-colossus-attack-v19.webp ForestGuard/art/painted-rampart-front-v24.webp MagicGarden/dist/ForestGuard/art/
          cp ForestGuard/art/rani-title-v31.webp ForestGuard/art/rani-rear-party-v31.webp ForestGuard/art/rani-board-acorn-v31.webp ForestGuard/art/rani-board-map-v31.webp ForestGuard/art/rani-button-atlas-v31.webp ForestGuard/art/rani-board-fox-v31.webp MagicGarden/dist/ForestGuard/art/
          cp ForestGuard/art/btn-{gold,emerald,stone,sapphire,parchment,crimson}-v33.webp MagicGarden/dist/ForestGuard/art/
          cp ForestGuard/art/rani-rearguard-v35.png ForestGuard/art/rani-element-spells-v38.png ForestGuard/art/rani-fox-rear-attack-v41.png MagicGarden/dist/ForestGuard/art/
          cp ForestGuard/art/rani-{bear,rabbit,cat,megafox}-attack-v44.webp MagicGarden/dist/ForestGuard/art/
          cp ForestGuard/art/forest-monsters-hurt-clean-v49.webp MagicGarden/dist/ForestGuard/art/
          cp ForestGuard/art/{forest-choice-card,recruit-bear-cutout,recruit-rabbit-cutout,recruit-cat-cutout}-v50.webp MagicGarden/dist/ForestGuard/art/
          cp ForestGuard/art/chapter{2-masked-mole,3-black-bell}-v51.webp MagicGarden/dist/ForestGuard/art/
          cp ForestGuard/art/chapter1-{root-giant,forest-sentinel}-v52.webp MagicGarden/dist/ForestGuard/art/
          cp ForestGuard/art/chapter1-thorn-beetle-v53.webp MagicGarden/dist/ForestGuard/art/
          cp ForestGuard/art/chapter1-mushroom-runner-v55.webp MagicGarden/dist/ForestGuard/art/
          cp ForestGuard/art/chapter1-sentinel-vfx-v56.webp MagicGarden/dist/ForestGuard/art/
          test -s MagicGarden/dist/ForestGuard/chapter-boss-v51.css
          test -s MagicGarden/dist/ForestGuard/art/chapter2-masked-mole-v51.webp
          test -s MagicGarden/dist/ForestGuard/art/chapter3-black-bell-v51.webp
          test -s MagicGarden/dist/ForestGuard/art/chapter1-root-giant-v52.webp
          test -s MagicGarden/dist/ForestGuard/art/chapter1-forest-sentinel-v52.webp
          test -s MagicGarden/dist/ForestGuard/art/chapter1-thorn-beetle-v53.webp
          test -s MagicGarden/dist/ForestGuard/art/chapter1-mushroom-runner-v55.webp
          test -s MagicGarden/dist/ForestGuard/art/chapter1-sentinel-vfx-v56.webp
          for asset in forest-choice-card recruit-bear-cutout recruit-rabbit-cutout recruit-cat-cutout; do test -s "MagicGarden/dist/ForestGuard/art/$asset-v50.webp"; done
          test -s MagicGarden/dist/ForestGuard/element-spells-v38.css
          test -s MagicGarden/dist/ForestGuard/art/rani-element-spells-v38.png
          test -s MagicGarden/dist/ForestGuard/art/rani-fox-rear-attack-v41.png
          for asset in bear rabbit cat megafox; do test -s "MagicGarden/dist/ForestGuard/art/rani-$asset-attack-v44.webp"; done
          test -s MagicGarden/dist/ForestGuard/art/recruit-rabbit-clean-v46.webp
          test -s MagicGarden/dist/ForestGuard/art/forest-monsters-hurt-clean-v49.webp
           test -s MagicGarden/dist/ForestGuard/art/rani-rearguard-v35.png
          test -s MagicGarden/dist/ForestGuard/art/btn-gold-v33.webp
          echo "Independent Forest Guard staged at /ForestGuard/"

      - name: Test and stage CannonTale as an independent web game
        shell: bash
        run: |
          set -euo pipefail
          node CannonTale/artillery_smoke_test.cjs
          test -s CannonTale/index.html
          test -s CannonTale/matter.min.js
          test -s CannonTale/Artillery_Fox_Bear_Atlas_v0_3.webp
          test -s CannonTale/Artillery_Rabbit_Cat_Atlas_v0_5.webp
          test -s CannonTale/Artillery_Action_UI_Atlas_v0_6.webp
          test -s CannonTale/Artillery_Stage_Atlas_v0_7.webp
          test -s CannonTale/Artillery_Enemy_Atlas_v0_8.png
          test -s CannonTale/Artillery_Material_Damage_Atlas_v1_0.webp
          test -s CannonTale/Artillery_Forest_Enemy_Atlas_v1_0.webp
          test -s CannonTale/Artillery_Illustrated_UI_v1_1.png
          test -s CannonTale/Artillery_Combat_Poses_v1_2.png
          if grep -Eqi '<svg([[:space:]>])' CannonTale/index.html; then
            echo "SVG markup is not permitted in CannonTale" >&2
            exit 1
          fi
          mkdir -p MagicGarden/dist/CannonTale
          cp CannonTale/index.html CannonTale/matter.min.js CannonTale/Artillery_Fox_Bear_Atlas_v0_3.webp CannonTale/Artillery_Rabbit_Cat_Atlas_v0_5.webp CannonTale/Artillery_Action_UI_Atlas_v0_6.webp CannonTale/Artillery_Stage_Atlas_v0_7.webp CannonTale/Artillery_Enemy_Atlas_v0_8.png CannonTale/Artillery_Material_Damage_Atlas_v1_0.webp CannonTale/Artillery_Forest_Enemy_Atlas_v1_0.webp CannonTale/Artillery_Illustrated_UI_v1_1.png CannonTale/Artillery_Combat_Poses_v1_2.png MagicGarden/dist/CannonTale/
          test -s MagicGarden/dist/CannonTale/index.html
          test -s MagicGarden/dist/CannonTale/Artillery_Material_Damage_Atlas_v1_0.webp
          test -s MagicGarden/dist/CannonTale/Artillery_Forest_Enemy_Atlas_v1_0.webp
          test -s MagicGarden/dist/CannonTale/Artillery_Illustrated_UI_v1_1.png
          test -s MagicGarden/dist/CannonTale/Artillery_Combat_Poses_v1_2.png
          # v2.0 illustration artwork is referenced by relative URLs from CannonTale/index.html.
          # Every binary asset must ship alongside the HTML, not only remain in GitHub source.
          mkdir -p MagicGarden/dist/CannonTale/art
          cp -a CannonTale/art/. MagicGarden/dist/CannonTale/art/
          for artwork in \
            home_pc_v2.webp home_mobile_v2.webp \
            title_logo.png mode_adventure.png mode_duel.png hero_chooser.png stage_chooser.png \
            hud_fire_ready.webp hud_fire_charge.webp hud_fire_pressed.webp hud_fire_disabled.webp \
            hud_ability_ready.webp hud_ability_used.webp hud_view_ready.webp \
            hud_weapon_normal.webp hud_weapon_bomb.webp hud_weapon_split.webp; do
            test -s "CannonTale/art/$artwork"
            test -s "MagicGarden/dist/CannonTale/art/$artwork"
          done
          grep -q 'art/home_mobile_v2.webp' MagicGarden/dist/CannonTale/index.html
          grep -q 'art/hud_fire_ready.webp' MagicGarden/dist/CannonTale/index.html
          echo "Independent CannonTale staged at /CannonTale/"

      - name: Upload short-lived Pages deployment artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: MagicGarden/dist
          retention-days: 1

  deploy:
    name: Publish actual GitHub Pages website
    needs: build
    runs-on: ubuntu-latest
    # Large multi-game Pages artifacts may finish syncing shortly after the
    # action's default 10-minute deadline. Keep the actual publish budget in
    # step with its explicit timeout without changing site contents.
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Verify GitHub Pages is enabled
        uses: actions/configure-pages@v5
      - name: Deploy website to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
