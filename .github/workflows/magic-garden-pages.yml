name: Magic Garden — actual GitHub Pages deployment

# Publishing build files to a branch with GITHUB_TOKEN is not a Pages deployment.
on:
  push:
    branches:
      - main
    paths:
      - 'MagicGarden/**'
      - 'SixtySecondPlayground/**'
      - '.github/workflows/magic-garden-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: magic-garden-real-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'junl-im/K-city-webgame' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout Magic Garden only
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install game dependencies
        working-directory: MagicGarden
        run: npm install --no-audit --no-fund
      - name: Build and run all game checks
        working-directory: MagicGarden
        run: npm run build
      - name: Verify site assets and record version
        shell: bash
        run: |
          set -euo pipefail
          test -s MagicGarden/dist/index.html
          test -s MagicGarden/dist/assets/town-scene-v1.webp
          test -s MagicGarden/dist/assets/creek-shimmer-v1.webp
          test -s MagicGarden/dist/assets/creek-cascade-v1.webp
          test -s MagicGarden/dist/assets/fox-four-directions-v1.webp
          printf '%s\n' "${GITHUB_SHA}" > MagicGarden/dist/deployed-source-sha.txt
          touch MagicGarden/dist/.nojekyll
      - name: Verify 60-second playground and stage a separate subpage
        shell: bash
        run: |
          set -euo pipefail
          node SixtySecondPlayground/tests/smoke.cjs
          test -s SixtySecondPlayground/dist/index.html
          test -s SixtySecondPlayground/dist/style.css
          test -s SixtySecondPlayground/dist/app.js
          mkdir -p MagicGarden/dist/SixtySecondPlayground
          cp -a SixtySecondPlayground/dist/. MagicGarden/dist/SixtySecondPlayground/
          test -s MagicGarden/dist/SixtySecondPlayground/assets/park-v3.webp
          echo "Independent arcade staged at /SixtySecondPlayground/"
      - name: Upload short-lived Pages deployment artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: MagicGarden/dist
          retention-days: 1

  deploy:
    name: Publish actual GitHub Pages website
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Verify GitHub Pages is enabled
        uses: actions/configure-pages@v5
      - name: Deploy website to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
