name: Physics Popbook — isolated source checks

on:
  pull_request:
    paths:
      - 'PhysicsPopbook/**'
      - '.github/workflows/physics-popbook-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'PhysicsPopbook/**'
      - '.github/workflows/physics-popbook-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run scientific models, scene, and artwork regression tests
        working-directory: PhysicsPopbook
        run: node --test *.test.mjs dist/*.test.mjs
      - name: Check deployable page and creator credit
        shell: bash
        run: |
          set -euo pipefail
          test -s PhysicsPopbook/dist/index.html
          test -s PhysicsPopbook/dist/assets/physics-props-atlas-v09.webp
          grep -q '© 2026 곰같은여우' PhysicsPopbook/dist/index.html
