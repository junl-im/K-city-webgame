<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151024"><title>곰같은여우 AI MUSIC RADIO</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#46316d,#151024 65%);color:#f9f4ff;font:15px system-ui,'Malgun Gothic',sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:800}.tag{font-size:11px;color:#d8b6f6;border:1px solid #72568e;padding:7px 10px;border-radius:20px}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:20px}.panel{background:#27213b;border:1px solid #594879;border-radius:25px;padding:25px;min-width:0}.art{overflow:hidden;height:200px;width:200px;border-radius:22px;margin:20px auto;background:linear-gradient(140deg,#a070c6,#343e7a);display:grid;place-items:center;font-size:75px}.art img{width:100%;height:100%;object-fit:cover}.eyebrow{color:#d4a9fa;font-size:12px;letter-spacing:2px;font-weight:800}h1{font-size:clamp(21px,4vw,30px);text-align:center;overflow-wrap:anywhere}h2{font-size:19px}.muted{color:#c5b9d7;line-height:1.65}.center{text-align:center}.progress{height:7px;border-radius:9px;background:#4f4269;overflow:hidden;margin:20px 0 8px}.fill{height:100%;width:0;background:#d8a7fa}.times{display:flex;justify-content:space-between;color:#c6b8d5;font-size:12px}.controls{display:flex;justify-content:center;align-items:center;gap:15px;margin:20px 0;flex-wrap:wrap}button{background:#d9b2ff;border:0;color:#21152d;padding:13px 23px;border-radius:13px;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.row{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#352c4d;border-radius:12px;padding:12px;margin:9px 0;overflow-wrap:anywhere}.status{font-size:13px;line-height:1.7;color:#e5cbed;min-height:45px}.small{font-size:12px;color:#b6a8ca}footer{text-align:center;color:#a79bb7;font-size:11px;margin-top:22px}@media(max-width:680px){.layout{grid-template-columns:1fr}.wrap{padding:12px}.panel{padding:18px}.art{width:138px;height:138px;margin:12px auto}}</style><div class="wrap"><header class="head"><span>♫ 곰같은여우 AI MUSIC RADIO</span><span class="tag">24H RADIO</span></header><main class="layout"><section class="panel"><div class="eyebrow">NOW PLAYING</div><div class="art"><img id="cover" alt="현재 곡의 표지" /></div><h1 id="title">방송 준비 중</h1><p class="muted center" id="album">8집 · 9집 / 총 55곡</p><div class="progress"><div class="fill" id="fill"></div></div><div class="times"><span id="elapsed">00:00</span><span id="duration">00:00</span></div><div class="controls"><button id="play" disabled>▶ 라디오 듣기</button><label class="small">음량 <input id="volume" type="range" min="0" max="100" value="75"></label></div><div id="status" class="status" role="status">음원 서버 연결을 확인하고 있습니다.</div></section><aside class="panel"><div class="eyebrow">ON AIR</div><h2>다음 방송곡</h2><div id="next" class="muted">편성표 연결 대기 중</div><h2>곰같은여우의 음악</h2><p class="muted">8집 35곡 · 9집 20곡. 폴더 선택이나 파일 업로드 없이 듣는 웹 라디오로 준비하고 있습니다.</p><p class="small">브라우저 자동재생 제한으로 처음에는 재생 버튼을 한 번 눌러야 합니다.</p></aside></main><footer>© 곰같은여우 · AI MUSIC RADIO</footer></div><audio id="audio" preload="metadata"></audio><script>
const $=id=>document.getElementById(id),audio=$('audio');let songs=[],active=false,current=-1,anchor=Date.parse('2026-10-28T15:00:00Z')/1000;const clock=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};function slot(){let sum=songs.reduce((n,t)=>n+t.duration,0),p=(((Date.now()/1000)-anchor)%sum+sum)%sum;for(let i=0;i<songs.length;i++){if(p<songs[i].duration)return {i,offset:p};p-=songs[i].duration}return {i:0,offset:0}}function paint(){if(!songs.length)return;let s=slot(),t=songs[s.i];if($('cover').dataset.track!==(t.id||String(s.i))){$('cover').dataset.track=t.id||String(s.i);$('cover').src=t.cover||''}$('title').textContent=t.title;$('album').textContent=(t.artist||'곰같은여우')+' · '+(t.album||'AI MUSIC RADIO');$('elapsed').textContent=clock(s.offset);$('duration').textContent=clock(t.duration);$('fill').style.width=(s.offset/t.duration*100)+'%';$('next').replaceChildren();for(let j=1;j<=3;j++){let n=songs[(s.i+j)%songs.length],d=document.createElement('div');d.className='row';d.textContent=n.title+' · '+(n.album||'');$('next').append(d)}if(active){if(current!==s.i)start(s);else if(!audio.paused&&Math.abs(audio.currentTime-s.offset)>5)audio.currentTime=s.offset}}function start(s){current=s.i;audio.src=songs[s.i].url;audio.onloadedmetadata=()=>{let n=slot();if(n.i!==current){start(n);return}audio.currentTime=Math.min(n.offset,Math.max(0,audio.duration-.1));audio.play().then(()=>$('status').textContent='방송 재생 중').catch(()=>$('status').textContent='재생 버튼을 다시 눌러 주세요.')};audio.load()}$('play').onclick=()=>{active=!active;$('play').textContent=active?'Ⅱ 일시정지':'▶ 라디오 듣기';if(!active){audio.pause();return}let s=slot();if(current!==s.i)start(s);else{audio.currentTime=s.offset;audio.play().catch(()=>{$('status').textContent='재생이 차단되었습니다.'})}};$('volume').oninput=e=>audio.volume=e.target.value/100;audio.volume=.75;audio.onended=()=>{if(active)start(slot())};audio.onerror=()=>{$('status').textContent='음원 파일을 불러올 수 없습니다. 음원 서버 상태를 확인해 주세요.'};fetch('./tracks.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('manifest');return r.json()}).then(data=>{anchor=(Date.parse(data.stationStart)||Date.parse('2026-10-28T15:00:00Z'))/1000;songs=(data.tracks||[]).filter(t=>t.url&&Number(t.duration)>0);if(!songs.length)throw Error('no-audio');$('play').disabled=false;$('status').textContent='방송 준비 완료. 재생 버튼을 눌러 주세요.';paint();setInterval(paint,1000)}).catch(()=>{$('status').textContent='55곡 원본 MP3의 서버 등록이 아직 완료되지 않았습니다. 음원이 준비되면 이 화면에서 바로 재생할 수 있습니다.';$('title').textContent='음원 연결 준비 중';$('next').textContent='음원 서버 연결 대기 중'});
</script></html>
